# ============================================================
# Nacos 用户中心配置（dataId: otto-user-service.yaml, group: OTTO_GROUP）
# ============================================================
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/otto_user?allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2B8&characterEncoding=utf8
    username: root
    password: root123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 邮件（QQ 邮箱示例；不配则验证码只打印日志）
  mail:
    host: smtp.qq.com
    port: 587
    username: your-email@qq.com
    password: your-smtp-auth-code

otto:
  minio:
    endpoint: http://127.0.0.1:9000
    access-key: otto
    secret-key: otto123456
    public-url: http://127.0.0.1:9000
    avatar-bucket: otto-avatar
